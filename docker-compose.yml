services:
  db:
    image: postgres:16
    container_name: appointment_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: appointment_admin
      POSTGRES_PASSWORD: devpassword123
      POSTGRES_DB: appointment_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: